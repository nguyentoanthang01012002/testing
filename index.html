<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Cat Island: Local Edition 🐾</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; }
        #ui { position: absolute; top: 20px; left: 20px; color: white; font-family: sans-serif; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 4px #000; pointer-events: none; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
</head>
<body>
    <div id="ui">Nông Trại Đảo Mèo 🐾</div>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(25, 25, 25);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const light = new THREE.DirectionalLight(0xffffff, 1.2);
        light.position.set(10, 20, 10);
        light.castShadow = true;
        scene.add(light);
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));

        const objLoader = new THREE.OBJLoader();
        const texLoader = new THREE.TextureLoader();

        const farmTiles = [];
        let catModel, targetPos;

        // --- TẢI Ô ĐẤT (Lấy file trực tiếp từ GitHub) ---
        const tileMat = new THREE.MeshLambertMaterial({ map: texLoader.load('SandNoise02.png') });
        objLoader.load('TileTest3X3_02.obj', (object) => {
            const spacing = 4.5;
            for (let x = -1; x <= 1; x++) {
                for (let z = -1; z <= 1; z++) {
                    const tile = object.clone();
                    tile.traverse(c => { if(c.isMesh) { c.material = tileMat; c.receiveShadow = true; } });
                    tile.scale.set(3.5, 3.5, 3.5);
                    tile.position.set(x * spacing, 0, z * spacing);
                    scene.add(tile);
                    farmTiles.push(tile);
                }
            }
        });

        // --- TẢI MÈO (Lấy file trực tiếp từ GitHub) ---
        const catMat = new THREE.MeshLambertMaterial({ map: texLoader.load('PC0017_Tex.png') });
        objLoader.load('PC0017.obj', (object) => {
            object.traverse(c => { if(c.isMesh) { c.material = catMat; c.castShadow = true; } });
            object.scale.set(2.5, 2.5, 2.5);
            object.position.set(0, 0.5, 0);
            catModel = object;
            scene.add(catModel);
        });

        // LOGIC DI CHUYỂN
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        window.addEventListener('mousedown', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(farmTiles, true);
            if (intersects.length > 0 && catModel) {
                let t = intersects[0].object;
                while(t.parent && t.parent !== scene) t = t.parent;
                targetPos = t.position.clone();
                targetPos.y = 0.5;
            }
        });

        function animate() {
            requestAnimationFrame(animate);
            if (catModel && targetPos) {
                if (catModel.position.distanceTo(targetPos) > 0.1) {
                    catModel.lookAt(targetPos.x, 0.5, targetPos.z);
                    catModel.position.lerp(targetPos, 0.1);
                }
            }
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
