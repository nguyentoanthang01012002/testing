<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Island: 3D Farm</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; } /* Bầu trời xanh */
        #ui-layer { 
            position: absolute; top: 15px; left: 15px; 
            color: white; font-family: sans-serif; font-size: 22px; 
            font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.6); 
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
</head>
<body>
    <div id="ui-layer">Nông Trại Đảo Mèo 🐾 <br> Vàng: 100 🪙</div>
    
    <script>
        // 1. TẠO SÂN KHẤU VÀ GÓC NHÌN (ISOMETRIC 2.5D giống game)
        const scene = new THREE.Scene();
        const aspect = window.innerWidth / window.innerHeight;
        const d = 10;
        const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
        camera.position.set(20, 20, 20); // Đặt camera nhìn chéo từ trên xuống
        camera.lookAt(scene.position);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. BẬT ĐÈN SÁNG MẶT TRỜI
        const light = new THREE.DirectionalLight(0xffffff, 1.2);
        light.position.set(10, 20, 10);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));

        // 3. CÔNG CỤ TẢI FILE GAME
        const objLoader = new THREE.OBJLoader();
        const texLoader = new THREE.TextureLoader();

        // --- A. TRIỆU HỒI MẶT ĐẤT ---
        const groundTex = texLoader.load('SandNoise02.png');
        const groundMat = new THREE.MeshLambertMaterial({ map: groundTex });

        objLoader.load('TileTest3X3_02.obj', function (object) {
            object.traverse(function (child) {
                if (child.isMesh) child.material = groundMat; // Mặc áo cát cho đất
            });
            object.scale.set(3, 3, 3); // Phóng to đất
            object.position.set(0, 0, 0); // Đặt ở trung tâm
            scene.add(object);
        });

        // --- B. TRIỆU HỒI BÉ MÈO ---
        // (LƯU Ý: Nếu tên file mèo của bác khác, hãy sửa lại ở 2 dòng dưới đây nhé)
        const catTex = texLoader.load('PC0017_Tex.png'); 
        const catMat = new THREE.MeshLambertMaterial({ map: catTex });

        objLoader.load('PC0017.obj', function (object) {
            object.traverse(function (child) {
                if (child.isMesh) child.material = catMat; // Mặc áo lông cho mèo
            });
            object.scale.set(2, 2, 2); // Kích thước mèo
            object.position.set(0, 1, 0); // Nhấc mèo lên cao 1 chút để không bị lún xuống đất
            scene.add(object);
        });

        // 4. VÒNG LẶP KHUNG HÌNH
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        // Tự động căn chỉnh khi bác kéo to/nhỏ cửa sổ trình duyệt
        window.addEventListener('resize', () => {
            const aspect = window.innerWidth / window.innerHeight;
            camera.left = -d * aspect; camera.right = d * aspect;
            camera.top = d; camera.bottom = -d;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
